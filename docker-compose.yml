services:
  db:
    image: postgres:16-alpine
    container_name: 3proxy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-panel}
      POSTGRES_USER: ${DB_USER:-panel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-panel} -d ${DB_NAME:-panel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  panel:
    build:
      context: ./panel
      dockerfile: Dockerfile
    container_name: 3proxy-panel
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: postgres://${DB_USER:-panel}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-panel}?sslmode=disable
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey32charslong123456}
      PORT: "8080"
      PROXY_CONTAINER_NAME: "3proxy-proxy"
      PROXY_CONFIG_PATH: "/etc/3proxy/3proxy.cfg"
      PROXY_LOG_PATH: "/var/log/3proxy/3proxy.log"
      API_TOKENS: "${API_TOKENS:-}"
      PUBLIC_HOST: "${PUBLIC_HOST:-}"
      REAPER_SECONDS: "${REAPER_SECONDS:-30}"
      HEALTHCHECK_MODE: "${HEALTHCHECK_MODE:-auto}"
      HEALTHCHECK_SECONDS: "${HEALTHCHECK_SECONDS:-30}"
      HEALTHCHECK_TIMEOUT: "${HEALTHCHECK_TIMEOUT:-10}"
      HEALTHCHECK_FAILS: "${HEALTHCHECK_FAILS:-1}"
      HEALTHCHECK_TARGETS: "${HEALTHCHECK_TARGETS:-api.openai.com:443,api.x.ai:443}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
    ports:
      # Loopback by default: the admin panel must not face the internet.
      # Set PANEL_BIND=0.0.0.0 in .env only behind a firewall/reverse proxy.
      - "${PANEL_BIND:-127.0.0.1}:${PANEL_PORT:-8080}:8080"
    volumes:
      - proxy_config:/etc/3proxy
      - proxy_logs:/var/log/3proxy
      - /var/run/docker.sock:/var/run/docker.sock

  proxy:
    build:
      context: ./3proxy
      dockerfile: Dockerfile
    container_name: 3proxy-proxy
    restart: unless-stopped
    depends_on:
      - panel
    network_mode: host
    volumes:
      - proxy_config:/etc/3proxy
      - proxy_logs:/var/log/3proxy

  caddy:
    image: caddy:2-alpine
    container_name: 3proxy-caddy
    restart: unless-stopped
    depends_on:
      - panel
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  proxy_config:
  proxy_logs:
  caddy_data:
  caddy_config:
