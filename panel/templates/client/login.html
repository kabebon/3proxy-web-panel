{{define "client/login.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">
    <div class="bg-slate-800 p-8 rounded-lg shadow-xl w-full max-w-md border border-slate-700">
        <h2 class="text-2xl font-bold text-white mb-6 text-center">Proxy Client Login</h2>
        
        {{if .Error}}
        <div class="bg-red-500/10 border border-red-500/50 text-red-500 px-4 py-3 rounded mb-4 text-center">
            {{.Error}}
        </div>
        {{end}}

        <form method="POST" action="/client/login" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Proxy Username</label>
                <input type="text" name="username" required class="w-full bg-slate-900 border border-slate-700 rounded-md py-2 px-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Proxy Password</label>
                <input type="password" name="password" required class="w-full bg-slate-900 border border-slate-700 rounded-md py-2 px-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 px-4 rounded-md transition-colors mt-4">
                Login
            </button>
        </form>
    </div>
</body>
</html>
{{end}}
