{{define "listener-row"}}
<tr class="hover:bg-slate-700/50 transition-colors">
    <td class="p-4 font-medium text-white">{{.Name}}</td>
    <td class="p-4 text-slate-300 uppercase">{{.Protocol}}</td>
    <td class="p-4 text-slate-300">{{if .BindIP}}{{.BindIP}}{{else}}*{{end}}:{{.Port}}</td>
    <td class="p-4 text-slate-300">
        {{if .UpstreamID}}
            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-500/10 text-blue-400 border border-blue-500/20">
                <i data-lucide="network" class="w-3 h-3 mr-1"></i> {{.Upstream.Name}}
            </span>
        {{else if .UpstreamGroupID}}
            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-purple-500/10 text-purple-400 border border-purple-500/20">
                <i data-lucide="layers" class="w-3 h-3 mr-1"></i> {{.UpstreamGroup.Name}}
            </span>
        {{else}}
            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-slate-700 text-slate-300 border border-slate-600">
                Direct
            </span>
        {{end}}
    </td>
    <td class="p-4">
        {{if .Enabled}}
            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-500/10 text-green-500 border border-green-500/20">Active</span>
        {{else}}
            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-red-500/10 text-red-500 border border-red-500/20">Disabled</span>
        {{end}}
    </td>
    <td class="p-4 text-right space-x-2">
        <button hx-get="/listeners/{{.ID}}/edit" hx-target="closest tr" hx-swap="outerHTML" class="text-indigo-400 hover:text-indigo-300 transition-colors" title="Edit">
            <i data-lucide="pencil" class="w-4 h-4 inline"></i>
        </button>
        <button hx-post="/listeners/{{.ID}}/toggle" hx-target="closest tr" hx-swap="outerHTML" class="text-slate-400 hover:text-white transition-colors" title="Toggle Status">
            {{if .Enabled}}
                <i data-lucide="eye-off" class="w-4 h-4 inline"></i>
            {{else}}
                <i data-lucide="eye" class="w-4 h-4 inline"></i>
            {{end}}
        </button>
        <button hx-delete="/listeners/{{.ID}}" hx-confirm="Are you sure you want to delete listener '{{.Name}}'?" hx-target="closest tr" hx-swap="outerHTML swap:300ms" class="text-red-400 hover:text-red-300 transition-colors" title="Delete">
            <i data-lucide="trash-2" class="w-4 h-4 inline"></i>
        </button>
    </td>
</tr>
{{end}}
