{{define "users/index.html"}}
<div class="mb-6 flex justify-between items-center">
    <h2 class="text-xl font-semibold text-white">Proxy Users</h2>
    <button hx-get="/users/new" hx-target="#form-container" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded shadow flex items-center space-x-2 transition-colors">
        <i data-lucide="plus" class="w-4 h-4"></i>
        <span>Add User</span>
    </button>
</div>

<div id="form-container" class="mb-6"></div>

<div class="bg-slate-800 rounded-lg border border-slate-700 shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-slate-900/50 border-b border-slate-700 text-slate-400 text-sm">
                    <th class="p-4 font-medium">Username</th>
                    <th class="p-4 font-medium">Listener</th>
                    <th class="p-4 font-medium">Bandwidth (In/Out)</th>
                    <th class="p-4 font-medium">Allowed IPs</th>
                    <th class="p-4 font-medium">Status</th>
                    <th class="p-4 font-medium">Expires</th>
                    <th class="p-4 font-medium text-right">Actions</th>
                </tr>
            </thead>
            <tbody id="users-tbody" class="divide-y divide-slate-700 text-sm">
                {{if .Users}}
                    {{range .Users}}
                        {{template "user-row" .}}
                    {{end}}
                {{else}}
                    <tr id="empty-state"><td colspan="7" class="p-8 text-center text-slate-500">No users found. Click "Add User" to create one.</td></tr>
                {{end}}
            </tbody>
        </table>
    </div>
</div>
{{end}}
