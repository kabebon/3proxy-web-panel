{{define "toast"}}
<div x-show="toast.show" 
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0 translate-y-4"
     x-transition:enter-end="opacity-100 translate-y-0"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100 translate-y-0"
     x-transition:leave-end="opacity-0 translate-y-4"
     class="fixed bottom-4 right-4 z-50 flex items-center p-4 rounded-lg shadow-lg border"
     :class="{
         'bg-slate-800 border-green-500/50 text-green-400': toast.type === 'success',
         'bg-slate-800 border-red-500/50 text-red-400': toast.type === 'error',
         'bg-slate-800 border-blue-500/50 text-blue-400': toast.type === 'info'
     }"
     style="display: none;">
    <div class="mr-3">
        <i data-lucide="check-circle" x-show="toast.type === 'success'" class="w-5 h-5"></i>
        <i data-lucide="alert-circle" x-show="toast.type === 'error'" class="w-5 h-5"></i>
        <i data-lucide="info" x-show="toast.type === 'info'" class="w-5 h-5"></i>
    </div>
    <div x-text="toast.message" class="text-sm font-medium"></div>
    <button @click="toast.show = false" class="ml-4 text-slate-400 hover:text-white">
        <i data-lucide="x" class="w-4 h-4"></i>
    </button>
</div>
{{end}}
