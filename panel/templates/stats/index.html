{{define "stats/index.html"}}
<div class="mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    <h2 class="text-xl font-semibold text-white">Statistics / Live Log</h2>
    
    <div class="flex items-center space-x-4 bg-slate-800 p-2 rounded-lg border border-slate-700 shadow-sm">
        <div class="relative">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i>
            <input type="text" name="username" placeholder="Filter by username..." 
                   hx-get="/stats/live" hx-target="#log-table" hx-trigger="keyup changed delay:500ms"
                   class="bg-slate-900 border border-slate-700 rounded-md py-1.5 pl-9 pr-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-indigo-500 w-48">
        </div>
        
        <label class="flex items-center space-x-2 cursor-pointer text-sm text-slate-300 border-l border-slate-700 pl-4" x-data="{ autoRefresh: true }">
            <span class="mr-2">Auto-refresh</span>
            <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                <input type="checkbox" x-model="autoRefresh" name="toggle" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer border-slate-400 checked:right-0 checked:border-indigo-500" style="transition: all 0.3s; right: 20px; z-index: 1;">
                <label class="toggle-label block overflow-hidden h-5 rounded-full bg-slate-700 cursor-pointer"></label>
            </div>
            
            <div x-show="autoRefresh" x-effect="
                if(autoRefresh) {
                    document.getElementById('log-table').setAttribute('hx-trigger', 'every 5s');
                    htmx.process(document.getElementById('log-table'));
                } else {
                    document.getElementById('log-table').removeAttribute('hx-trigger');
                    htmx.process(document.getElementById('log-table'));
                }
            "></div>
        </label>
    </div>
</div>

<div class="bg-slate-800 rounded-lg border border-slate-700 shadow-sm overflow-hidden flex flex-col h-[calc(100vh-12rem)]">
    <div class="overflow-x-auto flex-1 relative">
        <table class="w-full text-left border-collapse min-w-max">
            <thead class="sticky top-0 z-10 bg-slate-900 shadow">
                <tr class="border-b border-slate-700 text-slate-400 text-sm">
                    <th class="p-4 font-medium">Time</th>
                    <th class="p-4 font-medium">User</th>
                    <th class="p-4 font-medium">Source IP</th>
                    <th class="p-4 font-medium">Destination</th>
                    <th class="p-4 font-medium text-right">Bytes Sent</th>
                    <th class="p-4 font-medium text-right">Bytes Recv</th>
                </tr>
            </thead>
            <tbody id="log-table" class="divide-y divide-slate-700 text-sm font-mono" hx-get="/stats/live" hx-trigger="every 5s" hx-swap="innerHTML">
                {{template "stats-table" .}}
            </tbody>
        </table>
    </div>
</div>

<style>
    .toggle-checkbox:checked {
        right: 0;
        border-color: #6366f1;
        background-color: #6366f1;
    }
    .toggle-checkbox:checked + .toggle-label {
        background-color: #4f46e5;
    }
</style>
{{end}}
