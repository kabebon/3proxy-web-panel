{{define "group-form"}}
{{if .IsEdit}}
<tr id="group-edit-row">
    <td colspan="4" class="p-4 bg-slate-800">
{{else}}
<div class="bg-slate-800 p-6 rounded-lg border border-slate-700 mb-6 shadow-sm">
    <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-medium text-white">Add New Group</h3>
        <button onclick="document.getElementById('form-container').innerHTML = ''" class="text-slate-400 hover:text-white">
            <i data-lucide="x" class="w-5 h-5"></i>
        </button>
    </div>
{{end}}

    <form {{if .IsEdit}}hx-put="/groups/{{.Group.ID}}" hx-target="closest tr" hx-swap="outerHTML"{{else}}hx-post="/groups" hx-target="#form-container"{{end}} class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Name</label>
                <input type="text" name="name" value="{{if .Group}}{{.Group.Name}}{{end}}" required class="w-full bg-slate-900 border border-slate-700 rounded-md py-2 px-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                
                <div class="mt-4 flex items-center pb-2">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" name="enabled" value="true" {{if .Group}}{{if .Group.Enabled}}checked{{end}}{{else}}checked{{end}} class="w-4 h-4 bg-slate-900 border-slate-700 rounded text-indigo-600 focus:ring-indigo-500">
                        <span class="text-sm font-medium text-slate-300">Enabled</span>
                    </label>
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Members (Upstreams)</label>
                <div class="bg-slate-900 border border-slate-700 rounded-md p-3 max-h-48 overflow-y-auto space-y-2">
                    {{if .Upstreams}}
                        {{range .Upstreams}}
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" name="upstreams" value="{{.ID}}" class="w-4 h-4 bg-slate-800 border-slate-600 rounded text-indigo-600 focus:ring-indigo-500"
                                    {{if $.Group}}
                                        {{range $.Group.Members}}
                                            {{if eq .UpstreamID $.ID}}checked{{end}}
                                        {{end}}
                                    {{end}}>
                                <span class="text-sm text-slate-300">{{.Name}} ({{.Type}} {{.Host}}:{{.Port}})</span>
                            </label>
                        {{end}}
                    {{else}}
                        <p class="text-sm text-slate-500 italic">No upstreams available.</p>
                    {{end}}
                </div>
            </div>
        </div>
        
        <div class="flex justify-end space-x-3 pt-4 border-t border-slate-700">
            {{if .IsEdit}}
            <button type="button" hx-get="/groups/{{.Group.ID}}" hx-target="closest tr" hx-swap="outerHTML" class="px-4 py-2 text-sm font-medium text-slate-300 hover:text-white bg-slate-700 hover:bg-slate-600 rounded-md transition-colors">
                Cancel
            </button>
            {{else}}
            <button type="button" onclick="document.getElementById('form-container').innerHTML = ''" class="px-4 py-2 text-sm font-medium text-slate-300 hover:text-white bg-slate-700 hover:bg-slate-600 rounded-md transition-colors">
                Cancel
            </button>
            {{end}}
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-md shadow flex items-center space-x-2 transition-colors">
                <i data-lucide="save" class="w-4 h-4"></i>
                <span>Save Group</span>
            </button>
        </div>
    </form>

{{if .IsEdit}}
    </td>
</tr>
{{else}}
</div>
{{end}}
{{end}}
