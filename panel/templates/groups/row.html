{{define "group-row"}}
<tr class="hover:bg-slate-700/50 transition-colors">
    <td class="p-4 font-medium text-white">{{.Name}}</td>
    <td class="p-4 text-slate-300">
        {{if .Members}}
            <div class="flex flex-wrap gap-1">
            {{range .Members}}
                {{if .Upstream}}
                <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-slate-700 text-slate-300 border border-slate-600">
                    {{.Upstream.Name}}
                </span>
                {{end}}
            {{end}}
            </div>
        {{else}}
            <span class="text-slate-500 italic">No members</span>
        {{end}}
    </td>
    <td class="p-4">
        <span hx-post="/groups/{{.ID}}/toggle" hx-target="closest tr" hx-swap="outerHTML" 
            class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium transition-colors cursor-pointer {{if .Enabled}}bg-green-500/20 text-green-400 hover:bg-red-500/20 hover:text-red-400 border border-green-500/30{{else}}bg-red-500/20 text-red-400 hover:bg-green-500/20 hover:text-green-400 border border-red-500/30{{end}}"
            title="Click to toggle status">
            {{if .Enabled}}Active{{else}}Disabled{{end}}
        </span>
    </td>
    <td class="p-4 text-right space-x-2">
        <button hx-get="/groups/{{.ID}}/edit" hx-target="closest tr" hx-swap="outerHTML" class="text-indigo-400 hover:text-indigo-300 transition-colors" title="Edit">
            <i data-lucide="pencil" class="w-4 h-4 inline"></i>
        </button>
        <button hx-delete="/groups/{{.ID}}" hx-confirm="Are you sure you want to delete group '{{.Name}}'?" hx-target="closest tr" hx-swap="outerHTML swap:300ms" class="text-red-400 hover:text-red-300 transition-colors" title="Delete">
            <i data-lucide="trash-2" class="w-4 h-4 inline"></i>
        </button>
    </td>
</tr>
{{end}}
